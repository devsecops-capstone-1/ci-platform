name: Terraform CI

on:
  workflow_call:
    inputs:
      working_directory:
        description: Terraform root module directory
        required: false
        type: string
        default: "."

      terraform_version:
        description: Terraform CLI version
        required: false
        type: string
        default: "1.14.8"

      checkov_enabled:
        description: Run Checkov IaC scanning
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  terraform-fmt:
    name: Terraform Format
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Check formatting
        run: terraform fmt -check -recursive

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: terraform-fmt

    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Initialize without remote backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate -no-color

  checkov:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    if: ${{ inputs.checkov_enabled }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Scan Terraform configuration
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: ${{ inputs.working_directory }}
          framework: terraform
          soft_fail: false

  terraform-required:
    name: CI / Terraform Required
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - terraform-fmt
      - terraform-validate
      - checkov

    steps:
      - name: Verify required checks
        env:
          FMT_RESULT: ${{ needs.terraform-fmt.result }}
          VALIDATE_RESULT: ${{ needs.terraform-validate.result }}
          CHECKOV_RESULT: ${{ needs.checkov.result }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$FMT_RESULT" != "success" ]]; then
            echo "Terraform formatting failed or was cancelled."
            exit 1
          fi

          if [[ "$VALIDATE_RESULT" != "success" ]]; then
            echo "Terraform validation failed or was cancelled."
            exit 1
          fi

          if [[ "$CHECKOV_RESULT" != "success" && \
                "$CHECKOV_RESULT" != "skipped" ]]; then
            echo "Checkov failed or was cancelled."
            exit 1
          fi

          echo "All required Terraform CI checks passed."
